[package]
name = "guard_vault_sandbox_test"
version = "0.1.0"
edition = "2021"
publish = false
description = "End-to-end NEAR sandbox test for the GuardVault contract (kept in its own crate so the contract itself has no TLS dependency)"

[lib]
path = "src/lib.rs"

[dev-dependencies]
near-workspaces = "0.14.1"
tokio = { version = "1.40", features = ["full"] }
serde_json = "1.0"
