[package]
name = "near_guard_mcp"
version = "0.1.0"
edition = "2021"
description = "Model Context Protocol server that puts NEAR Agent Guard between an AI agent and a NEAR wallet"

[lib]
name = "near_guard_mcp"
path = "src/lib.rs"

[[bin]]
name = "near_guard_mcp"
path = "src/main.rs"

[dependencies]
near_guard_core = { path = "../near_guard_core" }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
serde_json = "1.0"
